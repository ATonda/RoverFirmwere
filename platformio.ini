; Rover GNSS – firmware ESP32
; Deska: DFRobot FireBeetle 2 ESP32-E (ESP32-WROOM-32E, 4 MB flash)
; Specifikace: docs/rover-firmware-specifikace.md

[env:rover]
; pevná verze platformy (Arduino jádro 3.3.12) – „stable“ by se samo aktualizovalo,
; jádro 4.x už nemá BluetoothSerial (SPP)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; jedna aplikace (bez OTA, nahrávání přes USB) + LittleFS (profily, body, měření)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=0

; JSON pro profily a příkazy z aplikace (pevná verze)
lib_deps =
    bblanchon/ArduinoJson@7.4.2
